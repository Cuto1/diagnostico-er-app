name: Build Diagnostico ER APK

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name não configurado."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Restore permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/diagnostico-er-release.jks"
          chmod 600 "$RUNNER_TEMP/diagnostico-er-release.jks"

      - name: Verify permanent Android signing key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/diagnostico-er-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/diagnostico-er-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Diagnostico-ER-Sincronizacao.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-ER-APK-Sincronizacao
          path: Diagnostico-ER-Sincronizacao.apk
          if-no-files-found: error

      - name: Read Android version
        id: android_version
        shell: bash
        run: |
          CODE=$(grep -E "versionCode[[:space:]]+[0-9]+" app/build.gradle | head -1 | grep -oE "[0-9]+")
          NAME=$(grep -E "versionName[[:space:]]+'[^']+'" app/build.gradle | head -1 | sed -E "s/.*versionName[[:space:]]+'([^']+)'.*/\1/")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.android_version.outputs.code }}
          VERSION_NAME: ${{ steps.android_version.outputs.name }}
        shell: bash
        run: |
          TAG="android-v${VERSION_CODE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Diagnostico-ER-Sincronizacao.apk --clobber
          else
            gh release create "$TAG" Diagnostico-ER-Sincronizacao.apk \
              --title "Diagnóstico E.R. Android ${VERSION_NAME}" \
              --notes "Atualização Android do Diagnóstico E.R. — versão ${VERSION_NAME}, código ${VERSION_CODE}."
          fi
