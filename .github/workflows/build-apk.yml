name: Build Diagnostico ER APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable Android signing key
        id: signing_key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: diagnostico-er-debug-signing-v1

      - name: Verify stable Android signing key
        shell: bash
        run: |
          if [ "${{ steps.signing_key.outputs.cache-hit }}" != "true" ] || [ ! -f ~/.android/debug.keystore ]; then
            echo "::error::A chave fixa de assinatura Android não foi restaurada. Build interrompido para evitar publicar um APK incompatível com instalações existentes."
            exit 1
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Diagnostico-ER-Sincronizacao.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-ER-APK-Sincronizacao
          path: Diagnostico-ER-Sincronizacao.apk
          if-no-files-found: error

      - name: Read Android version
        id: android_version
        shell: bash
        run: |
          CODE=$(grep -E "versionCode[[:space:]]+[0-9]+" app/build.gradle | head -1 | grep -oE "[0-9]+")
          NAME=$(grep -E "versionName[[:space:]]+'[^']+'" app/build.gradle | head -1 | sed -E "s/.*versionName[[:space:]]+'([^']+)'.*/\1/")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.android_version.outputs.code }}
          VERSION_NAME: ${{ steps.android_version.outputs.name }}
        shell: bash
        run: |
          TAG="android-v${VERSION_CODE}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Diagnostico-ER-Sincronizacao.apk --clobber
          else
            gh release create "$TAG" Diagnostico-ER-Sincronizacao.apk \
              --title "Diagnóstico E.R. Android ${VERSION_NAME}" \
              --notes "Atualização Android do Diagnóstico E.R. — versão ${VERSION_NAME}, código ${VERSION_CODE}."
          fi
