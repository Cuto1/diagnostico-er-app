name: Publicar versão online

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Disponibilizar APK Android
        shell: bash
        run: |
          mkdir -p docs/downloads
          curl -L --fail --retry 3 \
            "https://github.com/Cuto1/diagnostico-er-app/releases/download/android-v32/Diagnostico-ER-Sincronizacao.apk" \
            -o docs/downloads/Diagnostico-ER-v32.apk
          test -s docs/downloads/Diagnostico-ER-v32.apk

      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
